# Cloudflare Pages configuration.
name = "hkborah-com"
pages_build_output_dir = "."

# The journal functions import @libsql/client and bcryptjs, which need the
# Node compatibility layer. The site itself is plain static files.
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Build command and environment variables are set in the Pages dashboard, not
# here. The build command must be `npm ci` even though nothing is compiled:
# Cloudflare only installs dependencies when a build command is present, and
# without them the functions fail to bundle. See README.md.

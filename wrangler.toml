# Cloudflare Pages configuration.
name = "hkborah-com"
pages_build_output_dir = "."

# The journal functions import @libsql/client and bcryptjs, which need the
# Node compatibility layer. The site itself is plain static files.
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Note: Pages reads plain-text variables and secrets from the dashboard, not
# from this file. See functions/README.md for the list to set.
